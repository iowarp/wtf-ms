name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wtfms-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run wtfms-lint
        run: python3 scripts/lint.py
      - name: Run guardrail unit tests
        run: |
          python3 tests/test_verify_citations.py
          python3 tests/test_check_physics.py
          python3 tests/test_check_scripts.py
          python3 tests/test_record_metrics.py
      - name: Run eval harness unit tests (offline; no spend)
        run: |
          python3 eval/tests/test_metrics.py
          python3 eval/tests/test_state.py
          python3 eval/tests/test_report_baseline.py
          python3 eval/tests/test_steps.py
          python3 eval/tests/test_run_integration.py
